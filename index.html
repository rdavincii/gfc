<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>GFC Club Manager</title>
    <meta name="description" content="Gamuda Football Club manager: fixtures, squad cards, formations, match poster packs and club growth.">
    <link rel="icon" type="image/png" href="./assets/brand/gfc-logo.png">
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./ui.css">
    <script defer src="./initial-data.js"></script>
    <script defer src="./psd-import.js"></script>
    <script defer src="./game.js"></script>
    <script defer src="./cards.js"></script>
    <script defer src="./app.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="#overview" data-nav="overview" aria-label="Gamuda Football Club hub">
          <img src="./assets/brand/gfc-logo.png" alt="">
          <span class="brand-wordmark">GFC<span>club manager</span></span>
        </a>
        <nav class="primary-nav" aria-label="Club tools">
          <button class="nav-item is-active" type="button" data-nav="overview" aria-current="page"><span class="nav-glyph">🏠</span><span>Home</span></button>
          <button class="nav-item" type="button" data-nav="squad"><span class="nav-glyph">🃏</span><span>Squad</span></button>
          <button class="nav-item" type="button" data-nav="formation"><span class="nav-glyph">⚽</span><span>Tactics</span></button>
          <button class="nav-item" type="button" data-nav="matches"><span class="nav-glyph">📅</span><span>Matchday</span></button>
          <button class="nav-item" type="button" data-nav="game"><span class="nav-glyph">🏆</span><span>Club</span></button>
          <button class="nav-item" type="button" data-nav="analytics"><span class="nav-glyph">📊</span><span>Analytics</span></button>
        </nav>
        <div class="topbar-actions">
          <button class="xp-chip" id="xpChip" type="button" data-nav="overview" aria-label="Club level"></button>
          <span class="save-state" id="saveState" aria-live="polite">Saved locally</span>
          <button class="button button-primary" type="button" data-action="quick-match"><span>＋ Match</span></button>
          <button class="icon-button" type="button" data-action="settings" aria-label="Settings" title="Settings">⚙</button>
        </div>
      </header>
      <h1 id="pageTitle" class="visually-hidden">Hub</h1>
      <main class="app-content" id="appContent" tabindex="-1"></main>
    </div>
    <dialog class="dialog" id="modal" aria-labelledby="modalTitle"></dialog>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <input id="backupImport" type="file" accept="application/json,.json" hidden>
  </body>
</html>
